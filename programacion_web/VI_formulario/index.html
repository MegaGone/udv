<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario UDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex items-center justify-center h-screen bg-gray-900">
    <div class="w-full max-w-xs">
      <form
        id="loginForm"
        class="bg-gray-800 shadow-md rounded px-8 pt-6 pb-8 mb-4"
      >
        <h2 class="text-2xl text-white font-bold mb-6">Formulario UDV</h2>
        <div class="mb-4">
          <label
            class="block text-gray-300 text-sm font-bold mb-2"
            for="username"
          >
            Nombre completo
          </label>
          <input
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-300 bg-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500"
            id="username"
            type="text"
            placeholder="Nombre completo"
            required
            autocomplete="off"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-300 text-sm font-bold mb-2" for="dpi">
            Documento personal de identificación
          </label>
          <input
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-300 bg-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500"
            id="dpi"
            type="text"
            placeholder="2610...."
            required
            autocomplete="off"
          />
        </div>

        <div class="mb-6">
          <label
            class="block text-gray-300 text-sm font-bold mb-2"
            for="gender"
          >
            Género
          </label>
          <select
            id="gender"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-300 bg-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="" disabled selected>Selecciona tu género</option>
            <option value="male">Masculino</option>
            <option value="female">Femenino</option>
            <option value="other">Otro</option>
          </select>
        </div>

        <div class="flex items-center justify-between">
          <button
            type="submit"
            class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
          >
            Envíar
          </button>
        </div>
      </form>
    </div>

    <script src="main.js"></script>
  </body>
</html>
